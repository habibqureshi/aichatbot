[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "setuptools<81",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-google-community>=1.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0",
    "fastapi>=0.116.1",
    "asyncmy>=0.2.10",
    "langgraph-checkpoint-mysql>=2.0.17",
    "python-multipart>=0.0.20",
    "fastmcp>=2.13.0.1",
    "langchain-mcp-adapters>=0.1.11",
    "sqlalchemy>=2.0.43",
    "google-cloud-storage>=3.4.1",
    "twilio==9.8.6",
    "cloud-sql-python-connector>=1.18.5",
    "pymysql>=1.1.2",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "uvicorn>=0.35.0",
    "greenlet>=3.2.4",
    "langfuse>=4.0.0",
    "bcrypt==4.1.3",
    "audioop-lts>=0.2.2",
    "sounddevice>=0.5.5",
    "webrtcvad>=2.0.10",
    "deepgram-sdk>=6.1.1",
    "cartesia>=3.0.2",
    "certifi>=2026.2.25",
]

# Flat layout: many top-level dirs — setuptools needs explicit discovery for editable installs.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "aimodels*",
    "db*",
    "graph*",
    "graph_state*",
    "nodes*",
    "rag*",
    "router*",
    "schemas*",
    "services*",
    "utils*",
]

[tool.setuptools]
py-modules = ["main", "configs", "logger", "twilio_media_stream_mimic"]
